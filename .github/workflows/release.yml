name: Audited release artifact
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, rust-docs
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugin/package-lock.json
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked
      - run: npm ci --prefix plugin
      - run: npm run check --prefix plugin
      - name: Build and audit the same release payload
        shell: pwsh
        run: ./scripts/build-release.ps1
      - run: npm test --prefix plugin
      - run: npm audit --omit=dev --prefix plugin
      - uses: actions/upload-artifact@v4
        with:
          name: opencode-scheduler-windows-x64
          path: dist/opencode-scheduler-*-windows-x64.zip
          if-no-files-found: error
