[package]
name = "opencode-scheduler"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Durable one-shot prompt scheduling for OpenCode V2"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.22"
chrono-tz = "0.10"
iana-time-zone = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "process", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
axum = "0.8"
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
semver = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Console", "Win32_Security"] }

[dev-dependencies]
tempfile = "3"

[profile.dev.package."*"]
debug = false
